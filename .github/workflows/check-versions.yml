name: check-versions
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check-versions
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check vendor feeds
        run: python3 scripts/check_versions.py
      - name: Validate build
        run: python3 scripts/build.py
      - name: Commit changes
        run: |
          if git diff --quiet -- definitions; then echo "no changes"; exit 0; fi
          git config user.name "wisebyte"
          git config user.email "13454621+wisebyte@users.noreply.github.com"
          git add definitions
          git commit -m "check-versions: update definitions"
          git push origin HEAD:main
